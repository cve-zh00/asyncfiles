name: Release

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "asyncfiles/_version.py"

jobs:
  build-sdist:
    runs-on: ubuntu-22.04
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade setuptools wheel pip Cython~=3.0
          python setup.py sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.*

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-22.04-arm]
        python:
          - "cp39"
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
        cibw_arch: ["x86_64", "aarch64", "universal2"]
        exclude:
          - os: ubuntu-latest
            cibw_arch: universal2
          - os: ubuntu-latest
            cibw_arch: aarch64
          - os: macos-latest
            cibw_arch: aarch64
          - os: ubuntu-22.04-arm
            cibw_arch: x86_64
          - os: ubuntu-22.04-arm
            cibw_arch: universal2
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          submodules: true

      - name: Install macOS deps
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install gnu-sed libtool autoconf automake

      - uses: pypa/cibuildwheel@v2
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_TEST_SKIP: "*universal2:arm64"
          CIBW_BEFORE_BUILD_LINUX: >-
            yum install -y autoconf automake libtool ||
            apt-get update && apt-get install -y autoconf automake libtool

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.cibw_arch }}
          path: wheelhouse/*.whl

  benchmark:
    # Runs the resource-limited Docker benchmark (tiny/small/medium profiles)
    # and commits the refreshed results back to the release PR branch.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          submodules: true

      - name: Run Docker benchmark
        run: scripts/run_docker_benchmark.sh tiny small medium

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: benchmark/results/docker/*

      - name: Commit updated benchmark results
        # Fork PRs get a read-only token: results are still attached to the release
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/results/docker
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit"
          else
            git commit -m "chore(benchmark): update docker benchmark results [skip ci]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

  publish:
    needs: [build-sdist, build-wheels, benchmark]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: bench-results/


      - name: Publish Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            bench-results/*.md
            bench-results/*.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'
        with:
          verbose: true
