name: Windows

on:
  push:
    branches:
      - feat/windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install deps
        run: pip install --upgrade pip setuptools wheel "Cython~=3.0" pytest pytest-asyncio

      - name: Build
        run: python setup.py build_ext --inplace --cython-always

      - name: Test
        run: python -m pytest tests/ -v
